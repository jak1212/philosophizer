# disable web server
spring.main.web-application-type=none

# environment
app.env=uat  # or prod, depending on cluster

# DB comes from env (RDS later)
spring.jpa.hibernate.ddl-auto=create-drop
spring.datasource.url=jdbc:h2:mem:philosophizerdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.generate-unique-name=false
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always


# H2 console local only
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# explicit guard
app.mode=job

# Jobs
jobs.daily-email.enabled=true

# Mail comes from env (SES)
spring.mail.host=${SMTP_HOST}
spring.mail.port=587
spring.mail.username=${SMTP_USERNAME}
spring.mail.password=${SMTP_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true