apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: philosophizer-secrets
  namespace: philosophizer
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: philosophizer-secrets
    creationPolicy: Owner
  data:
    - secretKey: SMTP_HOST
      remoteRef:
        key: philosophizer/uat/app-config      # adjust to match your actual secret name
        property: SMTP_HOST
    - secretKey: SMTP_USERNAME
      remoteRef:
        key: philosophizer/uat/app-config
        property: SMTP_USERNAME
    - secretKey: SMTP_PASSWORD
      remoteRef:
        key: philosophizer/uat/app-config
        property: SMTP_PASSWORD
    - secretKey: MAIL_JOB_ENABLED
      remoteRef:
        key: philosophizer/uat/app-config
        property: MAIL_JOB_ENABLED