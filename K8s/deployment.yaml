apiVersion: apps/v1
kind: Deployment
metadata:
  name: philosophizer
spec:
  replicas: 3
  selector:
    matchLabels:
      app: philosophizer
  template:
    metadata:
      labels:
        app: philosophizer
    spec:
      containers:
        - name: app
          image: 733232591650.dkr.ecr.us-east-1.amazonaws.com/philosophizer/uat:latest
          ports:
            - containerPort: 8080
