apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: monitoring-ingress
  namespace: monitoring
  annotations:
    kubernetes.io/ingress.class: nginx
    # Optional: enable rewrite if you want / to be forwarded cleanly
    nginx.ingress.kubernetes.io/rewrite-target: /$1
spec:
  rules:
    - host: monitoring.uat.example.com  # Change to monitoring.prod.example.com in prod
      http:
        paths:
          - path: /(.*)       # Base path redirects to Grafana
            pathType: Prefix
            backend:
              service:
                name: grafana
                port:
                  number: 3000
          - path: /prometheus(/|$)(.*)
            pathType: Prefix
            backend:
              service:
                name: prometheus
                port:
                  number: 9090
          - path: /loki(/|$)(.*)
            pathType: Prefix
            backend:
              service:
                name: loki
                port:
                  number: 3100