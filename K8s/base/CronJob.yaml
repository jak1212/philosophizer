apiVersion: batch/v1
kind: CronJob
metadata:
  name: philosophizer-daily-email
spec:
  schedule: "0 7 * * *" # 7am
  timeZone: "America/New_York"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        spec:
          restartPolicy: Never
          containers:
            - name: philosophizer-job
              image: 733232591650.dkr.ecr.us-east-1.amazonaws.com/philosophizer/uat:latest
              env:
                - name: SPRING_PROFILES_ACTIVE
                  value: "uat,job"
                - name: APP_MODE
                  value: "job"

                # SMTP / SES
                - name: SMTP_HOST
                  valueFrom:
                    secretKeyRef:
                      name: philosophizer-secrets
                      key: host

                - name: SMTP_USERNAME
                  valueFrom:
                    secretKeyRef:
                      name: philosophizer-secrets
                      key: SMTP_USERNAME

                - name: SMTP_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: philosophizer-secrets
                      key: SMTP_PASSWORD
