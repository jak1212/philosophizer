apiVersion: apps/v1
kind: Deployment
metadata:
  name: philosophizer
spec:
  replicas: 1
  selector:
    matchLabels:
      app: philosophizer
  template:
    metadata:
      labels:
        app: philosophizer
    spec:
      containers:
        - name: philosophizer
          image: philosophizer:latest   # placeholder
          ports:
            - containerPort: 8080
          imagePullPolicy: IfNotPresent
