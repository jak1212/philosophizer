name: Deploy to UAT

on:
  push:
    branches:
      - uat

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Login to ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Docker image
        run: |
          docker build -t philosophizer-uat .
          docker tag philosophizer-uat:latest 733232591650.dkr.ecr.us-east-1.amazonaws.com/philosophizer/uat:uat-latest

      - name: Push Docker image
        run: |
          docker push 733232591650.dkr.ecr.us-east-1.amazonaws.com/philosophizer/uat:uat-latest

      - name: Update ECS service
        run: |
          aws ecs update-service \
            --cluster philosophizer-uat-cluster \
            --service philosophizer-uat-service \
            --force-new-deployment
